name: flurtek-crm

# Desenvolvimento: tudo roda em contêiner (Node 22 LTS + Postgres com pgvector).
# Suba com:  docker compose up -d     Veja logs:  docker compose logs -f app
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: node:22-bookworm
    working_dir: /app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_TRUST_HOST: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npx prisma generate &&
             npx prisma migrate deploy &&
             npm run dev -- -H 0.0.0.0"

  # Envia o que já foi aprovado (mensagens da equipe e ações do agente). Sem chave do ConextBot, só simula.
  worker:
    image: node:22-bookworm
    working_dir: /app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      app:
        condition: service_started
    command: sh -c "npx prisma generate >/dev/null 2>&1; npm run worker"

volumes:
  dbdata:
  node_modules:
  next_cache:
